<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1b6fd1">
  <title>¡Busca a Salcotín!</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- precarga de imágenes para que la experiencia parta más rápido -->
  <link rel="preload" as="image" href="assets/1.png">
  <link rel="preload" as="image" href="assets/intro.png">
</head>
<body>
  <!-- Imagen de la cámara trasera (fondo) -->
  <video id="camera-feed" playsinline muted autoplay></video>

  <!-- Escena 3D transparente encima de la cámara -->
  <canvas id="scene"></canvas>

  <!-- Flecha opcional hacia un Salcotín (se activa con CONFIG.SHOW_POINTER en js/main.js) -->
  <div id="pointer" class="hidden" aria-hidden="true">
    <svg viewBox="0 0 40 40" width="44" height="44">
      <circle cx="20" cy="20" r="18" fill="rgba(255,255,255,0.85)" />
      <path d="M14 11 L28 20 L14 29 Z" fill="#1b6fd1" />
    </svg>
  </div>

  <section id="start-screen" class="overlay">
    <div class="panel">
      <img class="intro-art" src="assets/intro.png" alt="¡Busca a Salcotín! Escanea tu entorno">
      <button id="start-button" class="pill" type="button">Comenzar</button>
      <p class="small">Te vamos a pedir permiso para usar la cámara y el movimiento del teléfono.</p>
    </div>
  </section>

  <section id="loading-screen" class="overlay hidden">
    <p>Activando cámara...</p>
  </section>

  <section id="error-screen" class="overlay hidden">
    <div class="panel">
      <h1>No se pudo iniciar</h1>
      <p id="error-message"></p>
      <button class="pill" type="button" onclick="location.reload()">Recargar página</button>
    </div>
  </section>

  <!-- three.js alojado en este mismo repositorio (sin CDN) -->
  <script src="lib/three.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

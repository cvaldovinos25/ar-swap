<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AR Swap</title>
  <link rel="stylesheet" href="css/style.css">

  <!--
    Motor de 8th Wall auto-alojado (gratis, sin appKey).
    1. Descarga xr-standalone.zip desde https://8th.io/xrjs
    2. Descomprímelo dentro de la carpeta xr8/ de este proyecto
    3. El archivo principal debe quedar en xr8/xr.js (o el nombre que traiga el zip)
  -->
  <script async src="./xr8/xr-standalone/xr.js" data-preload-chunks="slam"></script>

  <!-- three.js, cargado desde un CDN permitido -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <canvas id="camerafeed"></canvas>

  <div id="start-screen">
    <p>Toca para activar la cámara y el rastreo de movimiento.</p>
    <button id="start-button">Comenzar</button>
  </div>

  <div id="loading-screen" class="hidden">
    <p>Cargando cámara...</p>
  </div>

  <div id="debug-log" class="hidden"></div>

  <div id="permission-error" class="hidden">
    <p>Necesitamos acceso a la cámara para continuar. Revisa los permisos del navegador y recarga la página.</p>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
